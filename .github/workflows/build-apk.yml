name: Build RiceSales Manager V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -q RiceSalesManager_V5_Customer_FIXED2.zip -d rice-project
          find rice-project -name settings.gradle -type f -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find rice-project -name settings.gradle -type f | head -1)")
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        run: |
          find rice-project -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiceSales-Manager-V5-Customer
          path: rice-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
