name: Build RiceSales Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q RiceSalesManager_V4_Logo_Complete.zip -d rice-project
          echo "Project files:"
          find rice-project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find rice-project -name settings.gradle -type f | head -1)")
          echo "Building from: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        run: |
          find rice-project -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RiceSales-Manager-Final
          path: rice-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
