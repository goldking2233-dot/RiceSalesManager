name: Build RiceSales Manager V6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate final project ZIP
        shell: bash
        run: |
          set -e
          ZIP="RiceSalesManager_V5_FINAL.zip"
          test -f "$ZIP" || {
            echo "::error::Missing $ZIP in repository root."
            exit 1
          }

          rm -rf rice-project
          mkdir rice-project
          unzip -q "$ZIP" -d rice-project

          echo "Extracted project:"
          find rice-project -maxdepth 3 -type f | sort | head -100

      - name: Find Android project root
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find rice-project -name settings.gradle -type f -print -quit | xargs -r dirname)"

          test -n "$PROJECT_DIR" || {
            echo "::error::settings.gradle not found."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle -p "$PROJECT_DIR" clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK was not created."
            exit 1
          }

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiceSales-Manager-V6-Final
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
