name: Build Rice Shop APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q RiceShopSource_v2.zip -d rice-project

      - name: Build APK
        working-directory: rice-project/RiceShopSource_v2
        run: gradle assembleDebug

      - name: Find APK
        run: |
          find rice-project -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rice-shop-debug-apk
          path: rice-project/RiceShopSource_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
